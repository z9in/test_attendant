<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>근태관리 시스템 - 로그인</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-custom p-4 shadow-sm">
                <div class="text-center mb-4">
                    <h3 class="font-weight-bold text-dark"><i class="fas fa-user-shield text-primary"></i> 근태 관리 시스템</h3>
                    <p class="text-muted small">아이디와 비밀번호를 입력해 주세요.</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="userId" class="font-weight-bold">아이디</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                            </div>
                            <input type="text" class="form-control" id="userId" placeholder="아이디 입력" required>
                        </div>
                    </div>

                    <div class="form-group mb-4">
                        <label for="password" class="font-weight-bold">비밀번호</label>
                        <div class="input-group">
                            <div class="input-group-prepend">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            </div>
                            <input type="password" class="form-control" id="password" placeholder="비밀번호 입력" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-touch">
                        <i class="fas fa-sign-in-alt"></i> 로그인
                    </button>
                </form>
                <div id="loginError" class="alert alert-danger mt-3 d-none" role="alert"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // 브라우저/기기 고유 식별자(UUID/Fingerprint) 생성 및 저장
    function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem('app_device_mac');
        if (!deviceId) {
            deviceId = 'DEV-' + 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            }).toUpperCase();
            localStorage.setItem('app_device_mac', deviceId);
        }
        return deviceId;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const userId = document.getElementById('userId').value;
        const password = document.getElementById('password').value;
        const deviceMac = getOrCreateDeviceId();
        const errorDiv = document.getElementById('loginError');

        try {
            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, password, deviceMac })
            });

            const data = await response.json();
            if (response.ok && data.success) {
                window.location.href = '/';
            } else {
                errorDiv.innerText = data.error || '로그인에 실패했습니다.';
                errorDiv.classList.remove('d-none');
            }
        } catch (err) {
            errorDiv.innerText = '서버 통신 오류가 발생했습니다.';
            errorDiv.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
